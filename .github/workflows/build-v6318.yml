name: V6.3.18 Build 648 visual diagnostic APK
on:
  workflow_dispatch:
  push:
    branches: ['build/v6.3.18-648-checked']
    paths: ['android-v6318/**', '.github/workflows/build-v6318.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android-v6318
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Assemble diagnostic APK
        id: build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDiagnostic
      - name: Unit tests
        id: tests
        if: success()
        run: ./gradlew --no-daemon --stacktrace :app:testDiagnosticUnitTest
      - name: Verify APK and package evidence
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
        run: |
          mkdir -p ../delivery
          python3 ../ci-v6318-report.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BIST-VIOP-V6.3.18-BUILD648-APK-AND-REPORTS
          path: delivery/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V6318-unit-test-reports
          path: android-v6318/app/build/reports/tests/
          if-no-files-found: ignore
      - name: Enable KVM
        if: success()
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator checkpoint and UI test
        if: success()
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          working-directory: android-v6318
          script: |
            ./gradlew --no-daemon :app:connectedDiagnosticAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=tr.borsatakip.v5.ui.Build648RuntimeTest
            adb pull /sdcard/Android/data/tr.borsatakip.v5.diagnostic.v648checked/files/visual-screenshots ../screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V6318-emulator-evidence
          path: |
            screenshots/
            android-v6318/app/build/reports/androidTests/
            android-v6318/app/build/outputs/androidTest-results/
          if-no-files-found: ignore

name: BIST VIOP V6.3.1 scientific valuation Android
on:
  push:
    branches: [main]
    paths:
      - 'v631-overlay/**'
      - '.github/workflows/build-v631-valuation-button.yml'
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Reconstruct V6.3.1 source and version
        shell: bash
        run: |
          unzip -t 'BIST-VIOP-V6.2.8-BUILD628-TARAMA-CAKISMA-KORUMALI-KAYNAK.zip'
          mkdir -p v631
          unzip -q 'BIST-VIOP-V6.2.8-BUILD628-TARAMA-CAKISMA-KORUMALI-KAYNAK.zip' -d v631
          cp -a v629-overlay/app/src/. v631/app/src/
          cp -a v630-overlay/app/src/. v631/app/src/
          cp -a v631-overlay/app/src/. v631/app/src/
          sed -i 's/versionCode = 628/versionCode = 631/g; s/versionName = "6.2.8"/versionName = "6.3.1"/g; s/\.diagnostic\.v628audit/\.diagnostic\.v631audit/g' v631/app/build.gradle.kts
          sed -i 's/₺  UCUZ HİSSE TARAMA  ›  (Fiyat limiti seç)/▣  TEMEL DEĞERLEME TARAMASI  ›  (Tüm BIST)/g' v631/app/src/main/res/layout/activity_bist_scan.xml
          chmod +x v631/gradlew
          grep 'versionCode = 631' v631/app/build.gradle.kts
          grep 'versionName = "6.3.1"' v631/app/build.gradle.kts
          test -s v631/app/src/main/java/tr/borsatakip/v5/scan/FundamentalValuationEngine.kt
      - name: Assemble diagnostic APK
        working-directory: v631
        run: ./gradlew --no-daemon --stacktrace :app:assembleDiagnostic
      - name: Verify package and signed APK
        working-directory: v631
        shell: bash
        run: |
          APK=app/build/outputs/apk/diagnostic/app-diagnostic.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          META="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep '^package:')"
          echo "$META"
          [[ "$META" == *"name='tr.borsatakip.v5.diagnostic.v631audit'"* ]]
          [[ "$META" == *"versionCode='631'"* ]]
          [[ "$META" == *"versionName='6.3.1'"* ]]
      - name: JUnit diagnostic unit tests
        id: tests
        working-directory: v631
        if: success()
        continue-on-error: true
        run: ./gradlew --no-daemon --stacktrace :app:testDiagnosticUnitTest
      - name: Create patched source ZIP
        if: always()
        run: |
          if [ -d v631/app/src ]; then
            cd v631
            zip -q -r ../BIST-VIOP-V6.3.1-CI-SOURCE.zip . -x '*/build/*' '*.gradle-cache*'
          fi
      - name: Upload diagnostic APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BIST-VIOP-V6.3.1-DIAGNOSTIC-APK
          path: v631/app/build/outputs/apk/diagnostic/*.apk
          if-no-files-found: warn
      - name: Upload unit test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BIST-VIOP-V6.3.1-ANDROID-TESTS
          path: v631/app/build/reports/tests/
          if-no-files-found: ignore
      - name: Upload compiled source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BIST-VIOP-V6.3.1-SOURCE
          path: BIST-VIOP-V6.3.1-CI-SOURCE.zip
          if-no-files-found: ignore
      - name: Enforce tests
        if: steps.tests.outcome == 'failure'
        run: exit 1

name: V6.2.7 diagnostic APK build
on:
  push:
    branches: [main]
    paths:
      - 'BIST-VIOP-V6.2.7-BUILD627-KALICI-TANILAMA-TAM-KAYNAK.zip'
      - '.github/workflows/build-v627-diagnostic.yml'
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Use GitHub runner Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMGR"
          "$SDKMGR" --version
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate archive and extract
        run: |
          unzip -t 'BIST-VIOP-V6.2.7-BUILD627-KALICI-TANILAMA-TAM-KAYNAK.zip'
          mkdir -p v627
          unzip -q 'BIST-VIOP-V6.2.7-BUILD627-KALICI-TANILAMA-TAM-KAYNAK.zip' -d v627
          chmod +x v627/gradlew
      - name: Compile V6.2.7 diagnostic APK
        working-directory: v627
        run: ./gradlew --no-daemon --stacktrace :app:assembleDiagnostic
      - name: Validate APK signature and package metadata
        working-directory: v627
        shell: bash
        run: |
          APK=app/build/outputs/apk/diagnostic/app-diagnostic.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          META="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep '^package:')"
          echo "$META"
          [[ "$META" == *"name='tr.borsatakip.v5.diagnostic.v627audit'"* ]]
          [[ "$META" == *"versionCode='627'"* ]]
          [[ "$META" == *"versionName='6.2.7'"* ]]
      - name: Android unit tests
        id: tests
        working-directory: v627
        if: success()
        continue-on-error: true
        run: ./gradlew --no-daemon --stacktrace :app:testDiagnosticUnitTest
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BIST-VIOP-V6.2.7-DIAGNOSTIC-APK
          path: v627/app/build/outputs/apk/diagnostic/*.apk
          if-no-files-found: warn
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BIST-VIOP-V6.2.7-TEST-REPORTS
          path: v627/app/build/reports/tests/
          if-no-files-found: ignore
      - name: Fail if unit tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

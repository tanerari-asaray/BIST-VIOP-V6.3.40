name: BUILD 670 audited source, Android 15 and tested diagnostic
on:
  workflow_dispatch:
  push:
    branches: ['main', 'fix/build670-audit-20261026', 'fix/build670-chart-jump-20261026']
permissions:
  contents: read
concurrency:
  group: build670-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Use Android SDK supplied by GitHub hosted runner
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify source identity (except chart fix pending manifest update)
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          data=json.loads(pathlib.Path('SOURCE-SHA256.json').read_text())['source_sha256_by_path']
          changed='android-v6323/app/src/main/java/tr/borsatakip/v5/ui/PriceChartView.kt'
          mismatches=[p for p,h in data.items() if p != changed and hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()!=h]
          assert not mismatches, mismatches
          print('Chart fix under emulator test; remaining source hashes verified')
          PY
      - name: Gateway and point-in-time news contract tests
        run: node --experimental-strip-types --test server/tests/gateway.test.mjs server/tests/gateway_diagnostics.test.mjs server/tests/market_proxy.test.mjs
      - uses: actions/cache@v5
        id: gradle-cache
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: build670-gradle-${{ runner.os }}-${{ hashFiles('android-v6323/**/*.gradle.kts', 'android-v6323/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Unit tests, lint, application and test APK compilation
        working-directory: android-v6323
        run: bash ./gradlew --no-daemon --max-workers=2 '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m' :app:testDiagnosticUnitTest :app:lintDiagnostic :app:assembleDiagnostic :app:assembleDiagnosticAndroidTest
      - name: Reject empty or failing JVM reports
        run: python3 ci/build670-evidence.py jvm
      - uses: actions/upload-artifact@v6
        with:
          name: BUILD670-UNAPPROVED-TEST-INPUT
          path: |
            android-v6323/app/build/outputs/apk/diagnostic/*.apk
            android-v6323/app/build/outputs/apk/androidTest/diagnostic/*.apk
          if-no-files-found: error
      - uses: actions/cache/save@v5
        if: always() && steps.gradle-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: build670-gradle-${{ runner.os }}-${{ hashFiles('android-v6323/**/*.gradle.kts', 'android-v6323/gradle/wrapper/gradle-wrapper.properties') }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: BUILD670-NATIVE-REPORTS
          path: |
            android-v6323/app/build/reports/
            android-v6323/app/build/test-results/
          if-no-files-found: warn
  android15:
    needs: native-quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - width: 320
            scale: '1.0'
          - width: 320
            scale: '1.3'
          - width: 411
            scale: '1.0'
          - width: 411
            scale: '1.5'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v7
        with:
          name: BUILD670-UNAPPROVED-TEST-INPUT
          path: device-input
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real stock and S/D touch on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: |
            adb shell wm size ${{ matrix.width }}x800
            adb shell wm density 160
            adb shell settings put system font_scale ${{ matrix.scale }}
            bash ci/run-build670-device.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: BUILD670-DEVICE-REPORTS-${{ matrix.width }}-${{ matrix.scale }}
          path: build670-device/
          if-no-files-found: error

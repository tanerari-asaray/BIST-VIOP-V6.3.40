name: BIST VIOP diagnostic APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  android-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Build diagnostic APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDiagnostic
      - name: Unit tests
        id: tests
        if: success()
        continue-on-error: true
        run: ./gradlew --no-daemon :app:testDiagnosticUnitTest
      - name: Upload test APK
        if: success() || steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: BIST-VIOP-diagnostic-APK
          path: app/build/outputs/apk/diagnostic/*.apk
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
      - name: Fail when unit tests fail
        if: steps.tests.outcome == 'failure'
        run: exit 1
